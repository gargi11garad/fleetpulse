databases:
  - name: fleetpulse-db
    databaseName: fleetpulse
    user: fleetpulse
    plan: free

services:
  - type: web
    name: fleetpulse-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py create_admin_from_env && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fleetpulse-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
